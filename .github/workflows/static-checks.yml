name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Reject common TLS verification bypasses
        shell: bash
        run: |
          if grep -RInE 'verify[[:space:]]*=[[:space:]]*False|ssl\.CERT_NONE' \
            --include='*.py' .; then
            echo 'TLS certificate verification bypass found.'
            exit 1
          fi
